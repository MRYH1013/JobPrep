name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run content:build
      - name: Verify generated content is committed
        run: git diff --exit-code -- questions.js general-data.js content/coverage.json
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:smoke
      - run: npm run test:features
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-screenshots
          path: preview*.png
          if-no-files-found: ignore
