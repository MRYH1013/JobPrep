name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run content:build
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:smoke
      - run: npm run test:features
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package.json' }
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: JobPrep-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
            if (-not (Test-Path -LiteralPath $notes)) { $notes = 'CHANGELOG.md' }
            gh release create $env:GITHUB_REF_NAME --verify-tag --repo $env:GITHUB_REPOSITORY --title "JobPrep $env:GITHUB_REF_NAME" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe','.zip') -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
